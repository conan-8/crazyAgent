<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fixture — text event target</title>
    <style>
      html, body { margin: 0; height: 100%; }
      #sink {
        width: 100%;
        height: 100%;
        outline: none;
        font-size: 12px;
        color: transparent;
      }
    </style>
  </head>
  <body>
    <!--
      The typing sink: a contenteditable that receives keystrokes and reports
      them to its parent, mirroring how Google Docs routes typing into a hidden
      contenteditable while painting the result into a canvas.

      It is the element a ref-based `type`/`key` call must target.
    -->
    <div id="sink" contenteditable="true" role="textbox" aria-label="Document body"></div>
    <script>
      const sink = document.getElementById("sink");
      const report = () => {
        const text = sink.innerText;
        try {
          parent.postMessage({ type: "ba-sink", text }, "*");
        } catch {}
      };
      sink.addEventListener("input", report);
      sink.addEventListener("keyup", report);
      // Focus the sink as soon as the frame loads: Docs moves focus into its
      // sink when the user clicks the page body.
      sink.focus();
    </script>
  </body>
</html>
