<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fixture — canvas editor (Google Docs shaped)</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; }
      .toolbar { padding: 8px; background: #f1f3f4; }
      #canvas {
        display: block;
        width: 100%;
        height: 320px;
        background: #fff;
      }
      /* The hidden text sink Docs uses to receive keystrokes. */
      .docs-texteventtarget-iframe {
        position: absolute;
        width: 1px;
        height: 1px;
        border: 0;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!--
      Reproduces the Google Docs shape without Docs: the *visible* content is
      painted into a <canvas> (so no tool can read it), while typing goes
      through a hidden contenteditable "text event target" that key events are
      forwarded from. This is what lets us verify the documented playbook:

        - snapshot/read_page report the canvas surface as unreadable
        - refs still find the toolbar and the editable sink
        - typing works by focusing the sink and pressing keys
    -->
    <div class="toolbar" role="toolbar">
      <button id="bold" aria-label="Bold">B</button>
      <button id="undo" aria-label="Undo">Undo</button>
      <span id="wordcount">0 words</span>
    </div>

    <iframe class="docs-texteventtarget-iframe" src="canvas-sink.html" title="Text event target"></iframe>

    <canvas id="canvas" width="800" height="320"></canvas>

    <p id="status">ready</p>

    <script>
      const status = document.getElementById("status");
      const wc = document.getElementById("wordcount");
      let typed = "";

      function paint() {
        const ctx = document.getElementById("canvas").getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, 800, 320);
        ctx.fillStyle = "#202124";
        ctx.font = "18px Georgia, serif";
        // Content that exists ONLY as pixels — exactly like the Docs editor.
        ctx.fillText("RENDERED DOCUMENT TEXT", 40, 60);
        ctx.font = "14px Georgia, serif";
        ctx.fillText("Typed so far: " + (typed || "(nothing)"), 40, 100);
      }
      paint();

      // The sink reports what it received so a smoke can assert on it.
      window.addEventListener("message", (e) => {
        if (e.data && e.data.type === "ba-sink") {
          typed += e.data.text;
          wc.textContent = typed.trim().split(/\s+/).filter(Boolean).length + " words";
          status.textContent = "typed: " + typed;
          paint();
        }
      });

      document.getElementById("bold").addEventListener("click", () => {
        status.textContent = "bold toggled";
      });
    </script>
  </body>
</html>
