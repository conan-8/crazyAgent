<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fixture — login</title>
  </head>
  <body>
    <h1>Log in</h1>
    <form id="login-form" action="http://127.0.0.1:8790/docs.html" method="GET">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" />
      <button id="login-btn" type="submit">Log in</button>
    </form>
    <!-- Regex-safe purchase-ish label: no word from PURCHASE_RE, so only the
         Jev risk gate flags it (jev-smoke scenario B). After the form so the
         refs phase56 relies on (username=1, password=2, login=3) stay put. -->
    <button id="upgrade-btn" type="button">Upgrade plan</button>
  </body>
</html>
