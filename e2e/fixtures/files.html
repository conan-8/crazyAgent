<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CrazyAgent File Transfer Fixture</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 24px; max-width: 760px; }
    section { margin: 14px 0; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
    input[type="file"] { display: block; margin: 8px 0; }
    #hidden-file { display: none; }
    iframe { width: 100%; height: 110px; border: 1px solid #aaa; }
    #state { padding: 10px; white-space: pre-wrap; background: #f3f4f6; }
  </style>
</head>
<body>
  <h1>File transfer fixture</h1>
  <p><a href="payload.txt" download>Download payload</a></p>
  <p><button id="viewer-download" type="button">Download viewer payload</button></p>

  <section>
    <label for="hidden-file">Choose hidden attachment</label>
    <input id="hidden-file" type="file" aria-label="Chat attachment" hidden />
    <label for="visible-file">Visible attachment</label>
    <input id="visible-file" type="file" aria-label="Visible attachment" />
    <label for="other-file">Other attachment</label>
    <input id="other-file" type="file" aria-label="Other attachment" />
  </section>

  <section>
    <div id="shadow-host"></div>
  </section>

  <section>
    <iframe src="frame-files.html" title="File frame"></iframe>
  </section>

  <button id="send" type="button">Send attachment</button>
  <pre id="state">idle</pre>

  <script>
    const state = document.getElementById('state')
    let selected
    const describe = input => `${input.id || input.getAttribute('aria-label')}:${input.files[0]?.name ?? 'none'}:${input.files[0]?.size ?? 0}`
    const attach = input => {
      selected = input
      input.addEventListener('change', () => {
        selected = input
        state.textContent = `attached:${describe(input)}`
      })
    }
    document.querySelectorAll('input[type="file"]').forEach(attach)
    const shadow = document.getElementById('shadow-host').attachShadow({ mode: 'open' })
    shadow.innerHTML = '<input id="shadow-file" type="file" aria-label="Shadow attachment" />'
    attach(shadow.querySelector('input'))

    document.getElementById('viewer-download').addEventListener('click', async () => {
      const response = await fetch('/payload.txt')
      const url = URL.createObjectURL(await response.blob())
      const anchor = document.createElement('a')
      anchor.href = url
      anchor.download = 'Viewer+Payload.txt'
      anchor.click()
      setTimeout(() => URL.revokeObjectURL(url), 1000)
    })

    document.getElementById('send').addEventListener('click', async () => {
      if (!selected?.files[0]) {
        state.textContent = 'no-file-selected'
        return
      }
      const data = new FormData()
      data.append('file', selected.files[0])
      state.textContent = 'sending'
      try {
        const response = await fetch('/upload', { method: 'POST', body: data })
        const result = await response.json()
        state.textContent = `uploaded:${result.filename}:${result.size}`
      } catch (error) {
        state.textContent = `upload-failed:${error.message}`
      }
    })
  </script>
</body>
</html>
