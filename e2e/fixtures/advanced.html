<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CrazyAgent Advanced Fixture</title>
  <style>
    body { font: 14px/1.6 system-ui, sans-serif; margin: 18px; color: #111; }
    iframe { display: block; width: 420px; height: 120px; border: 1px solid #999; margin: 6px 0; }
    .row { margin: 10px 0; }
    .frame-clip { overflow: visible; }
    .frame-clip.clipped { width: 24px; height: 24px; overflow: hidden; }
    #menu-popup, #file-popup { position: absolute; background: #fff; border: 1px solid #888; padding: 6px; border-radius: 6px; }
    #file-popup [role="menuitem"] { padding: 6px 12px; cursor: pointer; }
    #page-setup-dialog { margin-top: 8px; padding: 8px; border: 1px solid #888; }
  </style>
</head>
<body>
  <h1>Advanced fixture</h1>

  <div class="row"><my-widget></my-widget></div>

  <div class="row">
    <label for="country">Country</label>
    <select id="country">
      <option value="us">United States</option>
      <option value="ca">Canada</option>
      <option value="gb">United Kingdom</option>
    </select>
    <span id="country-state">none</span>
  </div>

  <div class="row">
    <button id="menu" type="button">Menu</button>
    <div id="menu-popup" hidden><button id="menu-item" type="button">Menu item</button></div>
    <span id="menu-state">0</span>
  </div>

  <div class="row">
    <button id="file-menu" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="file-popup">File</button>
    <div id="file-popup" role="menu" aria-label="File" hidden></div>
    <span>page setup count: <span id="page-setup-count">0</span></span>
    <div id="page-setup-dialog" role="dialog" aria-label="Page setup" hidden>Page setup opened</div>
  </div>

  <div class="row">
    <div id="same-clip" class="frame-clip"><iframe id="same" src="frame-inner.html" title="Same origin frame"></iframe></div>
    <div id="cross-clip" class="frame-clip"><iframe id="cross" src="http://localhost:17872/frame-inner.html" title="Cross origin frame"></iframe></div>
  </div>

  <script>
    customElements.define('my-widget', class extends HTMLElement {
      constructor() {
        super()
        const root = this.attachShadow({ mode: 'open' })
        root.innerHTML = '<button id="shadow-button" type="button">Shadow action</button> <span id="shadow-state">0</span>'
        let count = 0
        root.getElementById('shadow-button').addEventListener('click', () => {
          count += 1
          root.getElementById('shadow-state').textContent = String(count)
        })
      }
    })

    document.getElementById('country').addEventListener('change', event => {
      document.getElementById('country-state').textContent = event.target.value
    })

    const popup = document.getElementById('menu-popup')
    document.getElementById('menu').addEventListener('mouseover', () => { popup.hidden = false })
    let menuCount = 0
    document.getElementById('menu-item').addEventListener('click', () => {
      menuCount += 1
      document.getElementById('menu-state').textContent = String(menuCount)
    })

    const fileMenu = document.getElementById('file-menu')
    const filePopup = document.getElementById('file-popup')
    fileMenu.addEventListener('click', () => {
      fileMenu.setAttribute('aria-expanded', 'true')
      filePopup.hidden = false
      filePopup.replaceChildren()
      setTimeout(() => {
        const item = document.createElement('div')
        item.id = 'page-setup-item'
        item.setAttribute('role', 'menuitem')
        item.tabIndex = 0
        item.textContent = 'Page setup'
        item.addEventListener('click', () => {
          const count = document.getElementById('page-setup-count')
          count.textContent = String(Number(count.textContent) + 1)
          document.getElementById('page-setup-dialog').hidden = false
          fileMenu.setAttribute('aria-expanded', 'false')
          filePopup.hidden = true
        })
        filePopup.append(item)
      }, 400)
    })
  </script>
</body>
</html>
