name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node unit/integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run npm test
        run: npm test

  android:
    # Optional and independent: this job can never block the Node job.
    # Toolchain pinned from android/README.md and android/gradle/libs.versions.toml:
    # Temurin JDK 21, Android SDK platforms;android-37.0 + build-tools;36.1.0,
    # Gradle wrapper 9.9.0 (compileSdk 37 / targetSdk 36 / minSdk 26, Java 17 bytecode).
    name: Android unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.1.0'
      - name: Run unit tests and lint
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon